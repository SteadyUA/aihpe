services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./server/data:/app/server/data
    environment:
      - LITELLM_API_URL=http://litellm:4000
    depends_on:
      - litellm

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    command: --config /app/config.yaml
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    env_file:
      - .env
